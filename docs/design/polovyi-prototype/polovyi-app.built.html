<style>
/* Layout: field journal. Olive topographic band = identity + navigation (desktop tabs); content is one 52rem column; phone gets a bottom bar with a "Ще" sheet. */
:root {

  --ok: #2F7A3E; --ok-soft: #DCEFE0; --late: #B3261E; --late-soft: #F8DAD7; --field: #FFFFFF; --band: #CFE2F6; --band-ink: #13284A; --band-line: #1B3358;
  --display: 'Oswald', 'Arial Narrow', system-ui, sans-serif; --body: 'PT Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; --mono: 'PT Mono', ui-monospace, Menlo, monospace;
  --cz-radius: 4px; --cz-btn-bg: var(--navy); --cz-btn-fg: var(--navy-ink); --cz-dot: var(--line); --cz-dot-on: var(--sky); --cz-cap: var(--ink-2); --lb-bg: rgba(18,22,15,.95);
}

  --bg: #0C121C; --paper: #141C29; --ink: #E2E8F2; --ink-2: #9BA8BC; --line: #26324A;
  --navy: #8DBBF2; --navy-ink: #0A1424; --sky: #6FA9EE; --sky-soft: #172A45; --sky-ink: #B9D6FA;
  --signal: #FF8A42; --signal-soft: #3B2213; --signal-ink: #FFC9A3;
  --ok: #86D49A; --ok-soft: #15301E; --late: #FF8A80; --late-soft: #3A1715; --field: #1A2334; --band: #1B3253; --band-ink: #E6EEF9; --band-line: #9CC4F4; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0C121C; --paper: #141C29; --ink: #E2E8F2; --ink-2: #9BA8BC; --line: #26324A;
  --navy: #8DBBF2; --navy-ink: #0A1424; --sky: #6FA9EE; --sky-soft: #172A45; --sky-ink: #B9D6FA;

/* shared structure: carousel, lightbox, reactions base, text scale */
html { font-size: calc(16px * var(--fs, 1)); }
html.lb-lock { overflow: hidden; }
.cz { display: grid; gap: .5rem; min-width: 0; }

.cz-slide img { width: 100%; height: 100%; object-fit: cover; display: block; user-select: none; }
.cz-btn { position: absolute; top: 50%; translate: 0 -50%; width: 2.5rem; height: 2.5rem; border-radius: 50%; border: 0; background: var(--cz-btn-bg); color: var(--cz-btn-fg); font-size: 1.5rem; line-height: 1; display: grid; place-items: center; cursor: pointer; opacity: .92; transition: opacity .15s, transform .15s; padding: 0 0 .15rem; }

.cz-prev { left: .6rem; } .cz-next { right: .6rem; }

.cz-dots { display: flex; justify-content: center; gap: .4rem; }

.cz-thumb { flex: 0 0 4rem; aspect-ratio: 4/3; border: 0; padding: 0; border-radius: calc(var(--cz-radius, 12px) / 2); overflow: hidden; cursor: pointer; opacity: .55; outline: 2px solid transparent; outline-offset: 1px; transition: opacity .15s; background: none; }
.cz-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cz-thumb.on { opacity: 1; outline-color: var(--cz-dot-on); }
@media (hover: none) { .cz-dots + .cz-btn, .cz-stage .cz-btn { width: 2.1rem; height: 2.1rem; } }

.lb { position: fixed; inset: 0; z-index: 50; background: var(--lb-bg, rgba(10,12,14,.92)); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }

.lb-close:focus-visible { outline: 3px solid #fff; }

.rx { display: inline-flex; align-items: center; gap: .3rem; cursor: pointer; font: inherit; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
.cz-cap { margin: 0; font-size: .85rem; color: var(--cz-cap, inherit); display: flex; gap: .4rem; align-items: baseline; }
.cz-cap b { font-variant-numeric: tabular-nums; }
.lb .cz-cap { color: #fff; justify-content: center; }
.cz-bar { display: flex; align-items: center; justify-content: center; gap: .9rem; }
.cz-bbtn { width: 2.4rem; height: 2.4rem; border-radius: 50%; border: 0; background: var(--cz-btn-bg); color: var(--cz-btn-fg); font-size: 1.4rem; line-height: 1; display: grid; place-items: center; cursor: pointer; padding: 0 0 .15rem; }
.cz-bbtn:hover { filter: brightness(1.1); }
.cz-bbtn:focus-visible { outline: 3px solid var(--cz-dot-on); outline-offset: 2px; }
.lb .cz-bbtn { background: rgba(255,255,255,.16); color: #fff; }
.lb .cz-dot { background: rgba(255,255,255,.35); } .lb .cz-dot.on { background: #fff; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 1.0625rem; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--navy); }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
svg.topo { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--band-line); opacity: .14; pointer-events: none; }

/* ---------- login ---------- */
.auth { min-height: 100vh; position: relative; overflow: hidden; background: var(--band); color: var(--band-ink); display: grid; place-items: center; padding: 2rem max(16px, env(safe-area-inset-right, 0px)) 2rem max(16px, env(safe-area-inset-left, 0px)); }
.auth-card { position: relative; width: min(100%, 25rem); background: var(--paper); color: var(--ink); border-radius: 8px; padding: 1.6rem 1.5rem; display: grid; gap: 1rem; box-shadow: 8px 8px 0 rgba(0,0,0,.18); }
.auth-head { display: flex; gap: .9rem; align-items: center; }
.auth-head h1 { margin: 0; font: 700 1.9rem/1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
.auth-head p { margin: .25rem 0 0; font: .74rem var(--mono); color: var(--ink-2); letter-spacing: .04em; }
.auth-foot { position: relative; margin-top: 1.2rem; font: .72rem var(--mono); letter-spacing: .06em; opacity: .8; text-align: center; }
.or { display: flex; align-items: center; gap: .7rem; font: .72rem var(--mono); color: var(--ink-2); text-transform: uppercase; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.demo { border: 2px dashed var(--line); border-radius: 6px; padding: .7rem; display: grid; gap: .5rem; }
.demo b { font: 600 .75rem var(--display); text-transform: uppercase; letter-spacing: .1em; color: var(--ink-2); }

/* ---------- patch ---------- */
.patch { width: 3.4rem; height: 3.4rem; border-radius: 50%; border: 3px dashed currentColor; display: grid; place-items: center; text-align: center; flex: none; line-height: 1; }
.patch b { font: 700 1.1rem/1 var(--display); display: block; }
.patch span { font: .5rem/1 var(--mono); letter-spacing: .08em; }
.auth .patch { color: var(--navy); width: 3.8rem; height: 3.8rem; }

/* ---------- app header ---------- */
.band { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; overflow: hidden; background: var(--band); color: var(--band-ink); }
.band .in { position: relative; max-width: 72rem; margin: 0 auto; padding: .7rem max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.idrow { display: flex; gap: .8rem; align-items: center; padding-bottom: .55rem; }
.idrow .patch { width: 2.7rem; height: 2.7rem; border-width: 2px; }
.idrow .patch b { font-size: .9rem; }
.idrow .grow { flex: 1; min-width: 0; }
.idrow h1 { margin: 0; font: 700 1.3rem/1 var(--display); text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.idrow p { margin: .15rem 0 0; font: .68rem var(--mono); opacity: .85; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fsq { display: flex; align-items: center; border: 1px solid color-mix(in srgb, currentColor 40%, transparent); border-radius: 99px; }
.fsq button { border: 0; background: none; width: 2.1rem; height: 2.1rem; border-radius: 50%; cursor: pointer; font: 700 .8rem var(--display); color: inherit; }
.fsq span { font: .7rem var(--mono); min-width: 2.6rem; text-align: center; }
.me { display: flex; align-items: center; gap: .5rem; text-decoration: none; color: inherit; border-radius: 99px; padding: .15rem .6rem .15rem .15rem; background: color-mix(in srgb, currentColor 12%, transparent); }
.me i { width: 2rem; height: 2rem; border-radius: 50%; background: var(--band-ink); color: var(--band); display: grid; place-items: center; font: 700 .75rem var(--display); font-style: normal; }
.me span { font-size: .82rem; font-weight: 700; white-space: nowrap; }
.tabs { display: flex; gap: .15rem; overflow-x: auto; scrollbar-width: none; }
.tabs a { text-decoration: none; color: inherit; font: 600 .86rem var(--display); text-transform: uppercase; letter-spacing: .06em; padding: .55rem .8rem; border-radius: 6px 6px 0 0; opacity: .8; white-space: nowrap; display: flex; align-items: center; gap: .4rem; }
.tabs a.on { background: var(--bg); color: var(--ink); opacity: 1; box-shadow: inset 0 3px 0 var(--sky); }
.tabs .sep { width: 1px; margin: .55rem .35rem; background: currentColor; opacity: .3; flex: none; }
.cnt { font: .66rem var(--mono); background: var(--signal); color: #fff; border-radius: 99px; padding: 0 .4rem; line-height: 1.4; letter-spacing: 0; }

.col { max-width: 52rem; margin: 0 auto; padding: 1.4rem max(16px, env(safe-area-inset-right, 0px)) 3rem max(16px, env(safe-area-inset-left, 0px)); }
.pagehead { display: flex; align-items: flex-end; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
.pagehead h2 { margin: 0; font: 700 1.9rem/1.05 var(--display); text-transform: uppercase; letter-spacing: .02em; }
.pagehead p { margin: .3rem 0 0; color: var(--ink-2); font-size: .95rem; }
.pagehead .grow { flex: 1; min-width: 12rem; }
.crumb { font: .74rem var(--mono); color: var(--ink-2); text-decoration: none; letter-spacing: .04em; display: inline-block; margin-bottom: .3rem; }
.h { font: 600 .82rem var(--display); text-transform: uppercase; letter-spacing: .12em; color: var(--ink-2); margin: 2rem 0 .8rem; display: flex; align-items: center; gap: .7rem; }
.h::after { content: ""; flex: 1; height: 2px; background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 10px); }
.h:first-child { margin-top: 0; }

/* ---------- primitives ---------- */
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 1.1rem 1.2rem; display: grid; gap: .75rem; min-width: 0; }
.card > h3, .card > header h3 { margin: 0; font: 600 1.2rem/1.2 var(--display); letter-spacing: .01em; }
.card p, .card ul, .card ol { margin: 0; }
.stack { display: grid; gap: 1rem; }
.btn { min-height: 2.6rem; border-radius: 4px; border: 2px solid var(--line); background: var(--paper); padding: .35rem 1rem; font: 600 .86rem var(--display); text-transform: uppercase; letter-spacing: .07em; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: .45rem; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--navy); }
.btn.pri { background: var(--navy); color: var(--navy-ink); border-color: var(--navy); }
.btn.sig { background: var(--signal); color: #fff; border-color: var(--signal); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--late); border-color: var(--late-soft); }
.btn.sm { min-height: 2.1rem; padding: .2rem .7rem; font-size: .76rem; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
.field { display: grid; gap: .3rem; }
.field > span { font: .72rem var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
.input, .select, .textarea { width: 100%; min-height: 2.75rem; border: 2px solid var(--line); border-radius: 4px; background: var(--field); padding: .45rem .8rem; min-width: 0; }
.textarea { min-height: 7rem; resize: vertical; line-height: 1.5; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--navy); outline: none; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: .8rem; }
.stamp { font: 600 .7rem var(--display); text-transform: uppercase; letter-spacing: .1em; color: var(--signal-ink); background: var(--signal-soft); padding: .15rem .5rem; border-radius: 3px; white-space: nowrap; }
.stamp.ok { background: var(--ok-soft); color: var(--ok); } .stamp.late { background: var(--late-soft); color: var(--late); } .stamp.mute { background: var(--bg); color: var(--ink-2); border: 1px solid var(--line); }
.mono { font-family: var(--mono); font-size: .9em; }
.muted { color: var(--ink-2); }
.small { font-size: .88rem; }
.empty { border: 2px dashed var(--line); border-radius: 6px; padding: 1.2rem; text-align: center; color: var(--ink-2); }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: .8rem 1.2rem; margin: 0; }
.kv dt { font: .7rem var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
.kv dd { margin: .1rem 0 0; font-weight: 700; overflow-wrap: anywhere; }
.av { width: 2.4rem; height: 2.4rem; border-radius: 50%; background: var(--bg); border: 2px solid var(--line); display: grid; place-items: center; font: 600 .78rem var(--display); flex: none; letter-spacing: .03em; }
.bar { height: .5rem; background: var(--bg); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--sky); }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: var(--paper); padding: .4rem .8rem; font: 600 .78rem var(--display); text-transform: uppercase; letter-spacing: .06em; cursor: pointer; }
.seg button + button { border-left: 2px solid var(--line); }
.seg button.on { background: var(--navy); color: var(--navy-ink); }
.sw { display: flex; align-items: center; gap: .9rem; cursor: pointer; }
.sw input { appearance: none; width: 3rem; height: 1.7rem; border-radius: 99px; background: var(--line); position: relative; cursor: pointer; flex: none; margin: 0; }
.sw input::after { content: ""; position: absolute; top: .2rem; left: .2rem; width: 1.3rem; height: 1.3rem; border-radius: 50%; background: var(--paper); transition: left .15s; }
.sw input:checked { background: var(--navy); } .sw input:checked::after { left: 1.5rem; }
.sw span { flex: 1; } .sw small { display: block; color: var(--ink-2); font-size: .82rem; }

/* list rows */
.list { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; }
.li { display: flex; gap: .8rem; align-items: center; padding: .65rem .9rem; border-bottom: 1px dashed var(--line); text-decoration: none; color: inherit; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.li:last-child { border-bottom: 0; }
a.li:hover, button.li:hover { background: color-mix(in srgb, var(--navy) 6%, transparent); cursor: pointer; }
.li .grow { flex: 1; min-width: 0; }
.li b { display: block; font-size: 1rem; line-height: 1.25; } .li small { display: block; font-size: .82rem; color: var(--ink-2); }
.li em { font: 600 .72rem var(--display); text-transform: uppercase; letter-spacing: .08em; font-style: normal; color: var(--navy); white-space: nowrap; }
.li .chev { color: var(--ink-2); font-size: 1.2rem; }

/* accordion (native details) */
details.acc { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; }
details.acc + details.acc { margin-top: .6rem; }
details.acc > summary { list-style: none; display: flex; align-items: center; gap: .8rem; padding: .85rem 1rem; cursor: pointer; }
details.acc > summary::-webkit-details-marker { display: none; }
details.acc > summary::after { content: "+"; margin-left: auto; font: 600 1.4rem/1 var(--display); color: var(--ink-2); transition: transform .15s; }
details.acc[open] > summary::after { transform: rotate(45deg); }
details.acc > summary .t { font: 600 1.12rem/1.2 var(--display); text-transform: uppercase; letter-spacing: .04em; }
details.acc > summary .s { font-size: .85rem; color: var(--ink-2); }
details.acc > summary .ico { width: 2.3rem; height: 2.3rem; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); display: grid; place-items: center; color: var(--navy); flex: none; }
details.acc > summary .ico svg { width: 1.2rem; height: 1.2rem; }
details.acc > .body { padding: 0 1rem 1rem; display: grid; gap: .9rem; }
details.acc details.acc { border-style: dashed; background: var(--bg); }
details.acc details.acc > summary .t { font-size: 1rem; }
details.acc[aria-disabled="true"] > summary { cursor: not-allowed; opacity: .6; }

/* timeline news */
.tl { position: relative; display: grid; gap: 1.4rem; }
.tl::before { content: ""; position: absolute; left: 3.1rem; top: .5rem; bottom: 0; width: 2px; background: var(--line); }
.entry { display: grid; grid-template-columns: 4.6rem minmax(0, 1fr); gap: 1rem; position: relative; }
.date { text-align: center; font-family: var(--display); line-height: 1; padding-top: .2rem; position: relative; z-index: 1; }
.date b { display: block; font-size: 1.8rem; font-weight: 700; background: var(--bg); }
.date span { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); background: var(--bg); padding: .2rem 0; }
.post.pin { border-color: var(--signal); box-shadow: 4px 4px 0 var(--signal-soft); }
.kick { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; font: .75rem var(--mono); color: var(--ink-2); letter-spacing: .03em; }
.post h3 { margin: 0; font: 600 1.4rem/1.2 var(--display); text-wrap: balance; }
.quote { margin: 0; border-left: 4px solid var(--navy); background: var(--sky-soft); border-radius: 0 6px 6px 0; padding: .65rem 1rem; display: grid; gap: .2rem; font-size: .98rem; }
.quote p { margin: 0; } .quote b { color: var(--sky-ink); }
.sig { font-size: .88rem; color: var(--ink-2); font-style: italic; }
.rxs { display: flex; gap: .35rem; flex-wrap: wrap; border-top: 1px dashed var(--line); padding-top: .7rem; }
.rx { border: 1px solid var(--line); background: transparent; border-radius: 4px; padding: .2rem .55rem; font-size: .88rem; font-family: var(--mono); }
.rx.on { background: var(--navy); color: var(--navy-ink); border-color: var(--navy); }
.editor-tools { display: flex; gap: .3rem; flex-wrap: wrap; border-bottom: 1px dashed var(--line); padding-bottom: .6rem; }
.editor-tools button { min-width: 2.3rem; height: 2.3rem; border: 1px solid var(--line); border-radius: 4px; background: var(--field); cursor: pointer; font-weight: 700; }

/* calendar: year timeline */
.yrs { margin-bottom: 1.2rem; flex-wrap: wrap; max-width: 100%; }
.ytl { position: relative; display: grid; gap: 1.1rem; }
.ytl::before { content: ""; position: absolute; left: 6.6rem; top: .4rem; bottom: .4rem; width: 2px; background: var(--line); }

  const FS = [0.875, 1, 1.125, 1.25, 1.375];

  }

  function topo() {
    if (topoCache) return topoCache;
    let out = '';
    [[560, 120, 13], [180, 230, 8], [760, 260, 6]].forEach(([cx, cy, n], s) => {
      for (let k = 1; k <= n; k++) {
        const r = k * 22, pts = [];
        for (let a = 0; a <= 64; a++) {
          const t = (a / 64) * Math.PI * 2;
          const rr = r * (1 + 0.16 * Math.sin(3 * t + k * 0.5 + s) + 0.09 * Math.cos(5 * t - k * 0.3) + 0.05 * Math.sin(9 * t + s));
          pts.push((cx + rr * Math.cos(t) * 1.35).toFixed(1) + ',' + (cy + rr * Math.sin(t)).toFixed(1));
        }
        out += `<polyline points="${pts.join(' ')}" fill="none" stroke="currentColor" stroke-width="${k % 4 === 0 ? 2 : 1}"/>`;
      }
    });
    return (topoCache = `<svg class="topo" viewBox="0 0 800 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${out}</svg>`);
  }

      <form class="card" data-save="Пароль змінено." novalidate><h3>Пароль</h3><div class="grid2"><label class="field"><span>Поточний пароль</span><input class="input" type="password" autocomplete="current-password"></label><label class="field"><span>Новий пароль</span><input class="input" type="password" autocomplete="new-password"></label></div><div><button class="btn pri" type="submit">Змінити пароль</button></div></form>
      <form class="card" data-save="Перевірте пошту на новій адресі: там лист із посиланням для підтвердження." novalidate><h3>Email</h3><p class="small muted">Зараз: ${esc(session.email)}</p><div class="grid2"><label class="field"><span>Нова адреса</span><input class="input" type="email"></label><label class="field"><span>Пароль</span><input class="input" type="password" autocomplete="current-password"></label></div><div><button class="btn pri" type="submit">Змінити email</button></div></form>
      <div><button type="button" class="btn danger wide" data-act="logout">Вийти</button></div></div>`;
  };

  P.approvals = () => head('Запити на затвердження', 'Зміни, які виховники й суддя просять внести', '', '<a class="crumb" href="#prefs">← НАЛАШТУВАННЯ</a>') +
    (approvals.length ? `<div class="stack">${approvals.map((a) => `<article class="card"><div class="kick"><span class="stamp">${esc(a.type)}</span><span>${fmtD(a.when)}</span></div>
      <h3>${esc(a.subj)}</h3><dl class="order"><dt>Було</dt><dd>${esc(a.from)}</dd><dt>Стане</dt><dd>${esc(a.to)}</dd><dt>Запит</dt><dd>${esc(a.who)}</dd></dl>
      <div class="row"><button type="button" class="btn pri" data-act="approve" data-id="${a.id}">Затвердити</button><button type="button" class="btn danger" data-act="reject" data-id="${a.id}">Відхилити</button></div></article>`).join('')}</div>` : '<p class="empty">Немає запитів, що очікують.</p>');

  let auditCat = 'Усі';
  P.audit = () => {
    const cats = ['Усі', ...new Set(AUDIT.map((a) => a.cat))];
    const list = AUDIT.filter((a) => auditCat === 'Усі' || a.cat === auditCat);
    return head('Журнал дій', 'Хто що змінив у курені', '', '<a class="crumb" href="#prefs">← НАЛАШТУВАННЯ</a>') +
      `<div class="card" style="margin-bottom:1rem"><div class="grid2"><label class="field"><span>Тип дії</span><select class="select" id="audit-cat">${cats.map((c) => `<option ${c === auditCat ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label><label class="field"><span>Від</span><input class="input" type="date" value="2026-11-01"></label><label class="field"><span>До</span><input class="input" type="date" value="2026-11-12"></label><label class="field"><span>Хто діяв</span><select class="select"><option>Хто діяв: усі</option>${[...new Set(AUDIT.map((a) => a.who))].map((w) => `<option>${esc(w)}</option>`).join('')}</select></label></div></div>
      <div class="list">${list.map((a) => `<div class="li"><span class="mono small" style="min-width:6.5rem">${fmtD(a.t)}<br>${a.t.slice(11, 16)}</span><span class="grow"><b>${esc(a.text)}</b><small>${esc(a.who)}</small></span><span class="stamp mute">${esc(a.cat)}</span></div>`).join('')}</div>
      <div style="margin-top:1rem"><button type="button" class="btn wide">Завантажити ще</button></div>`;
  };

  P.me = () => {
    const pos = { INTENDANT: 'Інтендант' };
    return head('Моя сторінка', '') +
      `<div class="prof" style="margin-bottom:1.2rem"><span class="bigav">${esc(session.initials)}</span><div><h2 style="margin:0;font:700 1.8rem/1.05 var(--display);text-transform:uppercase">${esc(session.last + ' ' + session.first)}</h2><p class="muted" style="margin:.3rem 0 0">${session.nick ? '«' + esc(session.nick) + '» · ' : ''}${esc(session.roleLabel)}</p></div></div>
      <div class="stack"><section class="card"><h3>Мої гуртки</h3>${session.hurtok ? `<p>Гурток «${esc(session.hurtok)}»</p>` : '<p class="muted">Вас ще не прикріплено до жодного гуртка.</p>'}</section>
      <section class="card"><h3>Діловодство</h3>${session.positions.length ? session.positions.map((p) => `<p><span class="stamp ok">${pos[p]}</span> з січня 2026</p>`).join('') : '<p class="muted">Посад зараз немає</p>'}</section>
      <section class="card"><h3>Дані</h3><dl class="kv"><div><dt>Email</dt><dd>${esc(session.email)}</dd></div><div><dt>Телефон</dt><dd>+380 67 123 45 67</dd></div><div><dt>Проживання</dt><dd>Львів</dd></div><div><dt>Навчання</dt><dd>${session.role === 'JUNAK' ? 'Ліцей №52' : 'ЛНУ ім. Франка'}</dd></div></dl><div><a class="btn sm" href="#prefs">Змінити в налаштуваннях</a></div></section></div>`;
  };

  /* ================= router ================= */
  const JZ = ['JUNAK', 'ZVYAZKOVYI'];
  const ALLOWED = { 'my-hurtok': ['VYKHOVNYK'], plast: JZ, proby: JZ, ai: JZ, activity: JZ, 'news-new': ['ZVYAZKOVYI'], approvals: ['ZVYAZKOVYI'], audit: ['ZVYAZKOVYI'] };
  function parse(h) { if (h.startsWith('user-') && h !== 'user-new') return ['user', h.slice(5)]; return [h, null]; }
  function render(keepScroll) {
    const h = location.hash.slice(1);
    document.querySelectorAll('.sheet').forEach((s) => s.remove());
    if (!session) { root.innerHTML = h === 'forgot' ? forgotPage() : loginPage(); afterRender(); return; }
    let [page, param] = parse(h || 'news');
    if (page === 'login' || page === 'forgot' || !P[page]) page = 'news';
    if (ALLOWED[page] && !ALLOWED[page].includes(session.role)) page = 'news';
    const n = navModel();
    if (['inventory', 'suddivstvo', 'import', 'pysarstvo', 'treasury'].includes(page) && !n.dil.some((d) => active(d, page))) page = 'news';
    const y = window.scrollY;
    root.innerHTML = shell(page, P[page](param));
    afterRender();
    if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
  }
  function afterRender() { const m = document.getElementById('msgs'); if (m) m.scrollTop = m.scrollHeight; }
  const rerender = () => render(true);
  window.addEventListener('hashchange', () => { archiveAsk = false; lendFor = null; render(false); });

  /* ================= events ================= */
  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    const act = a.dataset.act;
    if (act === 'login-role') { loginRole = a.dataset.role; render(true); }
    else if (act === 'google') { session = USERS[loginRole]; save(); location.hash = 'news'; render(); toast('Вхід через Google (демо)'); }
    else if (act === 'more') moreSheet();
    else if (act === 'logout') { session = null; try { sessionStorage.removeItem('plast-role'); } catch (err) { /* ignore */ } location.hash = 'login'; render(); }
    else if (act === 'cal-view') { cal.view = a.dataset.v; rerender(); }
    else if (act === 'cal-add') { cal.adding = !cal.adding; rerender(); }
    else if (act === 'ask-ai') { ai.point = a.dataset.p; }
    else if (act === 'ai-conv') { ai.conv = +a.dataset.i; rerender(); }
    else if (act === 'ai-new') { ai.convs.unshift({ title: 'Нова розмова', msgs: [] }); ai.conv = 0; rerender(); }
    else if (act === 'act-role') { a.parentElement.querySelectorAll('button').forEach((b) => { b.classList.toggle('on', b === a); b.setAttribute('aria-checked', String(b === a)); }); }
    else if (act === 'act-del') { activities.splice(+a.dataset.i, 1); rerender(); }
    else if (act === 'inv-cat') { invCat = a.dataset.c; rerender(); }
    else if (act === 'item-add') { addingItem = !addingItem; rerender(); }
    else if (act === 'item-lend') { lendFor = a.dataset.id; rerender(); const sel = document.querySelector(`[data-lend="${lendFor}"] select`); if (sel) sel.focus(); }
    else if (act === 'lend-cancel') { lendFor = null; rerender(); }
    else if (act === 'item-return') { const it = D.inventory.find((i) => i.id === a.dataset.id); it.lent = null; rerender(); toast(`«${it.name}» повернуто на склад`); }
    else if (act === 'sync') toast('Записано 3 зміни: 2 дати ступенів і 1 новий юнак');
    else if (act === 'import-go') { location.hash = 'suddivstvo'; toast(isZv() ? 'Імпортовано 4 рядки' : 'Запит надіслано звʼязковому'); }
    else if (act === 'tx-type') { txType = +a.dataset.t; rerender(); }
    else if (act === 'start-edit') { editStart = !editStart; rerender(); }
    else if (act === 'theme') { const t = a.dataset.t; if (t === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t; rerender(); }
    else if (act === 'approve' || act === 'reject') { const x = approvals.find((r) => r.id === a.dataset.id); approvals = approvals.filter((r) => r.id !== a.dataset.id); AUDIT.unshift({ t: '2026-11-12T10:05', who: session.first + ' ' + session.last, cat: 'Люди', text: `${act === 'approve' ? 'Затвердив' : 'Відхилив'} запит «${x.type}» для ${x.subj}` }); rerender(); toast(act === 'approve' ? 'Затверджено' : 'Відхилено'); }
    else if (act === 'archive-ask') { archiveAsk = !archiveAsk; rerender(); }
    else if (act === 'archive-yes') { archiveAsk = false; rerender(); toast(isZv() ? 'Юнака архівовано (демо)' : 'Запит на архівацію надіслано звʼязковому'); }
  });
  // locked proby stage cannot open
  document.addEventListener('toggle', (e) => { const d = e.target; if (d.matches && d.matches('details[data-locked]') && d.open) d.open = false; }, true);

  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'login-email') { /* free edit */ }
    if (t.id === 'kurin-q') { kurinQ = t.value; document.getElementById('kurin-list').innerHTML = rosterList(); }
    if (t.id === 'skill-q') { skillQ = t.value; document.getElementById('skill-list').innerHTML = skillList(); }
  });
  document.addEventListener('change', (e) => { if (e.target.id === 'audit-cat') { auditCat = e.target.value; rerender(); } });

  function save() { try { sessionStorage.setItem('plast-role', session.role); } catch (err) { /* ignore */ } }
  document.addEventListener('submit', (e) => {
    const f = e.target; e.preventDefault();
    const val = (id) => (document.getElementById(id) || {}).value || '';
    const showErr = (id, on) => { const el = document.getElementById(id); if (el) el.hidden = !on; };
    if (f.id === 'login-form') {
      if (!val('login-email').includes('@') || !val('login-pass')) { showErr('login-err', true); return; }
      session = USERS[loginRole]; save(); location.hash = 'news'; render();
    } else if (f.id === 'forgot-form') { forgotSent = true; render(true); }
    else if (f.id === 'post-form') {
      const title = val('post-title').trim(), body = val('post-body').trim();
      if (!title || !body) { showErr('post-err', true); return; }
      D.news.unshift({ id: 'n' + Date.now(), pinned: document.getElementById('post-pin').checked, tag: val('post-tag'), author: { first: session.first, last: session.last, initials: session.initials }, role: session.roleLabel, date: '2026-11-12T10:00', title, body: body.split(/\n\s*\n/), photos: [], reactions: {}, mine: null });
      location.hash = 'news'; toast('Опубліковано');
    } else if (f.id === 'ev-form') {
      const t = val('ev-title').trim(); if (!t) return;
      EVENTS.push({ d: val('ev-date'), t, p: val('ev-place') || 'Деталі згодом' }); cal.adding = false; cal.view = 'next'; rerender(); toast('Подію додано');
    } else if (f.id === 'ai-form') {
      const t = val('ai-text').trim(); if (!t) return;
      const c = ai.convs[ai.conv]; c.msgs.push({ me: true, t }); if (c.title === 'Нова розмова') c.title = t.slice(0, 40);
      ai.typing = true; rerender();
      setTimeout(() => { ai.typing = false; c.msgs.push({ me: false, t: 'Пропоную план на тиждень:<ol><li>Прочитай вимоги точки і випиши, що вже вмієш.</li><li>Потренуйся двічі з кимось із гуртка.</li><li>Домовся з гуртковим про показ на найближчих сходинах.</li></ol>Якщо щось незрозуміло, запитай мене конкретніше.' }); if (location.hash === '#ai') rerender(); }, 1100);
    } else if (f.id === 'act-form') {
      const t = val('act-title').trim(); if (!t) return;
      const r = f.querySelector('[data-act="act-role"].on').dataset.r;
      activities.unshift({ t, role: r, d: val('act-desc') || '' }); rerender(); toast('Додано');
    } else if (f.id === 'new-user-form') {
      if (!val('nu-first').trim() || !val('nu-last').trim()) { showErr('nu-err', true); return; }
      location.hash = 'kurin'; toast(isZv() ? 'Користувача створено' : 'Запит створено. Юнак зʼявиться після затвердження звʼязковим.');
    } else if (f.id === 'item-form') {
      const name = val('it-name').trim(); if (!name) { showErr('it-err', true); return; }
      const cat = val('it-cat'), icon = { 'Табірне': 'tent', 'Кухня': 'pot', 'Інструмент': 'saw', 'Світло': 'lantern', 'Вузли та мотузки': 'rope', 'Безпека': 'aid' }[cat] || 'tent';
      D.inventory.unshift({ id: 'i' + Date.now(), name, cat, icon, hue: 50, qty: +val('it-qty') || 1, place: 'Склад', condition: 'Новий', desc: val('it-desc'), lent: null, photos: [D.photo(icon, 50, 0), D.photo(icon, 125, 1)] });
      addingItem = false; invCat = 'Усі'; rerender(); toast('Річ додано');
    } else if (f.hasAttribute('data-lend')) {
      const who = f.who.value, due = f.due.value;
      if (!who || !due) { f.querySelector('[data-err]').hidden = false; return; }
      const it = D.inventory.find((i) => i.id === f.dataset.lend); const q = +f.qty.value || 1;
      it.lent = { who: who + (q > 1 ? ` (${q} шт)` : ''), due }; lendFor = null; rerender(); toast(`«${it.name}» видано: ${who}, повернути до ${D.fmtDue(due)}`);
    } else if (f.id === 'apd-form') { apdDone = val('apd-name') || 'АПД'; rerender(); toast('Документ створено'); }
    else if (f.id === 'tx-form') {
      const amt = Math.round(+val('tx-amt')); if (!(amt > 0)) { showErr('tx-err', true); return; }
      treasury.tx.unshift({ d: '2026-11-12', amt: amt * txType, t: val('tx-desc') || (txType > 0 ? 'Прибуток' : 'Витрата') }); rerender(); toast('Запис додано');
    } else if (f.id === 'start-form') { treasury.start = Math.round(+val('start-val')) || 0; editStart = false; rerender(); toast('Збережено'); }
    else if (f.id === 'assign-form') toast('Посаду призначено (демо)');
    else if (f.id === 'transfer-form') toast(isZv() ? 'Юнака переведено' : 'Запит на переведення надіслано, очікує затвердження звʼязковим.');
    else if (f.hasAttribute('data-save')) toast(f.dataset.save || 'Збережено.');
  });

  try { if (!session && location.hash.slice(1) !== 'forgot') history.replaceState(null, '', '#login'); } catch (err) { /* ignore */ }
  render();
})();

</script>
